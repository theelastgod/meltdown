# The counter-ledger Worker: SIWE wallet link, sponsored Ghostfile + stamp vouchers, name vouchers,
# the market view. A separate script from meltdown-match so the PvP Durable Object bundle never
# carries an economy module or a chain client. Deploy after meltdown-match:
#   npx wrangler secret put SIGNER_KEY -c wrangler.counter.toml
#   npx wrangler secret put RELAYER_KEY -c wrangler.counter.toml
#   npx wrangler deploy -c wrangler.counter.toml
name = "meltdown-counter"
main = "server/counter-worker.ts"
compatibility_date = "2025-06-01"

[vars]
# Solana mainnet. $CAPITAL is the published Token-2022 mint. The treasury is a
# separate key, not that mint and not a published dev key. CHAIN_ID stays 0:
# EVM settlement is still closed. An empty SOLANA_RPC uses the public mainnet endpoint.
CHAIN_ID = "0"
CHAIN_RPC = ""
CONTRACTS = "{}"
SIWE_DOMAINS = ""
SOLANA_CLUSTER = "mainnet-beta"
SOLANA_RPC = ""
SOLANA_MINT = "kLtXrN1jJ5YcCmVaGbgD1f65Jfej72xaSWG9fDPpump"
SOLANA_TREASURY = "3K6kZkUNmQ1CKLAnHMTkrEhmJQcZem6KD71ry6hTtaww"

[durable_objects]
bindings = [
  { name = "PLAYER_FILE", class_name = "PlayerFile", script_name = "meltdown-match" },
  { name = "ENDGAME", class_name = "Endgame", script_name = "meltdown-match" },
]

# The nightly job (server/counter-worker.ts `scheduled`): THE RUN settles yesterday at 01:00 UTC
# every day, the Audit posts on Mondays, the Deep Wake at a season boundary. Each is guarded
# against settling a period twice, so a duplicated trigger costs nothing.
[triggers]
crons = ["0 1 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "meltdown-ghostfile"
database_id = "fda078bf-052f-48fb-a061-0d5393226bb7"

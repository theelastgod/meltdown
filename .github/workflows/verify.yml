name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test
      - run: npm run probe
      - run: npm run probe:look
      - run: npm run probe:net
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-proof
          path: probe/out/

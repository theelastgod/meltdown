name: deploy

# Ships MELTDOWN: the client to Cloudflare Pages, the three Workers (match, campaign, counter)
# with wrangler. Runs on pushes to main when the Cloudflare secrets are set (docs/DEPLOY.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  workers:
    runs-on: ubuntu-latest
    if: ${{ vars.CF_DEPLOY == '1' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy -c wrangler.campaign.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy -c wrangler.counter.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  pages:
    runs-on: ubuntu-latest
    needs: workers
    if: ${{ vars.CF_DEPLOY == '1' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_LEDGER_URL: ${{ vars.VITE_LEDGER_URL }}
          VITE_CAMPAIGN_WS: ${{ vars.VITE_CAMPAIGN_WS }}
          VITE_CAMPAIGN_URL: ${{ vars.VITE_CAMPAIGN_URL }}
          VITE_COUNTER_URL: ${{ vars.VITE_COUNTER_URL }}
          VITE_PUBLIC_ROOM: ${{ vars.VITE_PUBLIC_ROOM }}
          VITE_BUILD: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npx wrangler pages deploy dist --project-name meltdown --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

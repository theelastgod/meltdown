<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) is real on a notched phone; no user scaling,
         because a pinch mid-duel is a zoom rather than a shot (Stage 32) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="MELTDOWN" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>MELTDOWN</title>
    <link rel="stylesheet" href="/client/hud/hud.css" />
    <!-- the $CAPITAL mark (Stage 679): named here so the service worker precaches it for offline play -->
    <link rel="preload" as="image" href="/icons/capital-64.png" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <!-- The loading card's first frame: the trip that reloaded this page wrote where it was going
         (client/loading.ts), so paint that before the bundle arrives rather than a black page. The
         bundle's LoadingCard adopts this element; the markup is LOADING_HTML, verbatim. -->
    <script>
      (function () {
        try {
          if (/[?&](headless|loading=0)(=|&|$)/.test(location.search)) return;
          var d = JSON.parse(sessionStorage.getItem("meltdown.loading") || "null");
          if (!d || typeof d.title !== "string" || typeof d.line !== "string" || !/^[a-z]+$/.test(d.kind)) return;
          var el = document.createElement("div");
          el.id = "loading";
          el.dataset.boot = "1";
          el.className = "on " + d.kind;
          el.innerHTML = '<img class="art" alt=""><div class="vig"></div><div class="body" role="status" aria-live="polite"><div class="ttl"></div><div class="ln"></div><div class="bar"><i></i></div><div class="st"></div><div class="tip"></div><div class="go" hidden></div></div><div class="scan"></div>';
          var w = document.createElement("span");
          w.className = "w";
          w.textContent = d.title;
          el.querySelector(".ttl").appendChild(w);
          el.querySelector(".ln").textContent = d.line;
          el.querySelector(".st").textContent = "LOADING THE DISTRICT …";
          var img = el.querySelector(".art");
          if (typeof d.art === "string" && d.art.charAt(0) === "/") img.src = d.art;
          else img.hidden = true;
          document.body.appendChild(el);
        } catch (e) {
          /* no storage, no card: the bundle's own boot still shows one */
        }
      })();
    </script>
    <script type="module" src="/client/main.ts"></script>
  </body>
</html>
